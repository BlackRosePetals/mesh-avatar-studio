[workspace]
members = ["crates/mesh-avatar-core", "crates/mesh-avatar-wgpu", "apps/mesh-avatar-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
mesh-avatar-core = { path = "crates/mesh-avatar-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
zip = { version = "2", default-features = false }
